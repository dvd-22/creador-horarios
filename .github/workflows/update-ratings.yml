name: Update Professor Ratings

on:
    workflow_dispatch:
    workflow_call:

jobs:
    update-ratings:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Pull latest changes
              run: |
                  git fetch origin
                  git reset --hard origin/${{ github.ref_name }}

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: Extract professors list
              run: npm run extract-professors

            - name: Fetch professor ratings
              run: npm run fetch-ratings

            - name: Checkout gh-pages branch
              uses: actions/checkout@v5
              with:
                  ref: gh-pages
                  path: gh-pages

            - name: Publish ratings data to gh-pages
              run: |
                  mkdir -p gh-pages/data
                  cp public/data/professors.json gh-pages/data/
                  cp public/data/ratings.json gh-pages/data/
                  cd gh-pages
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add data/professors.json data/ratings.json
                  if ! git diff --staged --quiet; then
                    git commit -m "Update professor ratings - $(date '+%Y-%m-%d %H:%M:%S')"
                    git push origin gh-pages
                  else
                    echo "No changes to commit"
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
